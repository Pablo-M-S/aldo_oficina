services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina_db
    ports:
      - "5432:5432"
    volumes:
      - oficina_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      target: build
    command: npm run start:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://oficina:oficina@db:5432/oficina_db?schema=public"
      JWT_SECRET: "dev-secret-nao-use-em-producao"
      JWT_EXPIRES_IN: "8h"
      PORT: 3000
      NODE_ENV: development
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

volumes:
  oficina_db_data:
